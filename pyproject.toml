
[project]
name = "ophelia-cli"
version = "0.1.0"
description = "A cli AI coding assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich",
    "prompt-toolkit",
    "python-dotenv",
    "pytest>=9.1.1",
]

[project.scripts]
ophelia = "src.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
